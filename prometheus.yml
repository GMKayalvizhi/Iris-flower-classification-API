global:
  scrape_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "iris-api"
    static_configs:
      - targets: ["api:8000"]
    # Send the API key when scraping the protected /metrics endpoint.
    http_headers:
      X-API-Key:
        files:
          - "/etc/prometheus/api_key"